<style>
@media(max-width: 600px) {

body {

  background: linear-gradient(135deg, #f5f0e6, #eae3d8);
  margin: 0;
  padding: 0;
  color: #4d3b2b;
}
.header-info {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 999;
  background-color: rgba(255, 255, 255, 0.8);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.strip {
  width: 100%;
  padding: 12px 0;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 20px;
}
.top-strip {
  background: linear-gradient(135deg, #dad4c0, #e7ddcf);
}
.menu-strip {
  background: linear-gradient(135deg, #d2c5b8, #cab79d);
}
h1 {
  font-family: 'Pacifico', cursive;
  font-size: 2.5em;
  margin: 0;
  color: #5d4a3d;
}
.menu-strip a {
  margin: 0 15px;
  text-decoration: none;
  font-weight: 700;
  font-size: 1.2em;
  color: #5d4a3d;
  transition: color 0.3s;
}
.menu-strip a:hover {
  color: #8b7c6d;
}
.content {
  max-width: 900px;
  margin: 0 auto 40px auto;
  padding: 20px;
  background-color: rgba(245, 245, 245, 0.8);
  border-radius: 8px;
}
h2 {
  font-family: 'Pacifico', cursive;
  font-size: 2em;
  margin-top: 20px;
  color: #4d3b2b;
}

/* Стиль для фото меню */
.menu-photos {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 30px 0;
}
.menu-photos a {
  max-width: 420px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  transition: transform 0.3s ease;
  display: block;
}
.menu-photos a:hover {
  transform: scale(1.05);
  cursor: pointer;
}
.menu-photos img {
  width: 100%;
  height: auto;
  display: block;
}
</style>
</head>
